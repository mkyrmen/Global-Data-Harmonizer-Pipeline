# Supabase CLI local development configuration.
# Run `supabase start` then `supabase db push` to apply migrations.

project_id = "global-data-harmonizer"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[mailer]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
template = "confirmation"

[storage]
enabled = true

[realtime]
enabled = true

[analytics]
enabled = true