# Render blueprint — backend API service.
# Deploy this repo via the Render dashboard -> "Blueprint" -> select render.yaml.
# Set SUPABASE_* env vars as secrets once the service is created.
services:
  - type: web
    name: global-data-harmonizer-api
    runtime: python
    plan: free
    buildFilter:
      paths:
        - "src/**"
        - "backend/**"
        - "config/**"
    buildCommand: pip install -e ".[backend,reporting]"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3