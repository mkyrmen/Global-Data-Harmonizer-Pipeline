[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-data-harmonizer"
version = "1.0.0"
description = "Global Data Harmonizer — ingest, profile, clean, harmonize and validate multi-source socio-economic datasets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Global Data Harmonizer Team" }]
keywords = ["etl", "data-engineering", "data-quality", "harmonization", "pandas"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# The pure-Python harmonization engine (no web stack required).
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
reporting = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
backend = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "supabase>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "PyJWT>=2.8",
  "cryptography>=42",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pycountry>=24.6",
]

[project.scripts]
data-harmonize = "data_harmonizer.pipeline.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: `Depends(...)` / `File(...)` in argument defaults is the idiomatic
# FastAPI dependency-injection pattern and is safe at runtime.
ignore = ["B008"]